[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pong-q-learning"
version = "1.0.2"
description = "PONG z tablicowym Q-learningiem i rozszerzoną fizyką"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["matplotlib>=3.9,<4", "reportlab>=4,<6", "pypdf>=6,<8"]

[project.scripts]
pong = "pong.cli:main"

[tool.setuptools.packages.find]
where = ["kod"]
include = ["pong*"]
